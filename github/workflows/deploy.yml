name: Deploy Award Management System

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run tests
      run: npm run test --if-present
      
    - name: Build project
      run: npm run build
      
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: github.ref == 'refs/heads/main'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        
    - name: Create Release
      if: github.ref == 'refs/heads/main'
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        release_name: Release v${{ github.run_number }}
        body: |
          ## نظام التميز المؤسسي - الإصدار الجديد
          ### Award Management System - New Release
          
          ### التحديثات الجديدة | New Updates:
          - تحسينات في الأداء | Performance improvements
          - إصلاح الأخطاء | Bug fixes
          - ميزات جديدة | New features
          
          ### الوظائف المتاحة | Available Features:
          ✅ العمل بدون اتصال إنترنت | Full offline functionality
          ✅ واجهة ثنائية اللغة | Bilingual interface
          ✅ تصميم متجاوب | Responsive design
          ✅ ألوان هيئة الشارقة الرسمية | Official SBA branding
          
          🌐 **الرابط المباشر | Live Demo**: https://your-username.github.io/award-management-system
        draft: false
        prerelease: false
